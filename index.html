<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nuvola</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>Nuvola<span>Point Cloud Viewer</span></h1>

    <div class="panel">
      <h2>Load Data</h2>
      <button class="primary full" id="btn-load">Open Point Cloud</button>
      <input type="file" id="file-input" accept=".ply,.gz,.ply.gz,.las,.laz,.xyz,.txt,.pts,.rxp,.e57" />
      <div class="row mt-2"><input type="text" id="potree-url" placeholder="Potree metadata.json URL" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:5px 8px;font-size:0.75rem" /></div>
      <button class="full" id="btn-load-potree" style="margin-top:4px">Load Potree Dataset</button>
      <p class="stat mt-2" id="file-info">No file loaded<br/>PLY, LAS, LAZ, XYZ, E57</p>
    </div>
    
    <div class="panel">
      <h2>View</h2>
      <div class="row"><label>Zoom</label><input type="range" id="zoom-slider" min="0.01" max="1000" step="0.01" value="1" /><span class="val" id="zoom-val">1.0</span></div>
      <div class="btn-grid" id="view-btns">
        <button data-view="0" class="active" title="North">N</button>
        <button data-view="1" title="East">E</button>
        <button data-view="2" title="South">S</button>
        <button data-view="3" title="West">W</button>
      </div>
      <div class="row-group">
        <div class="row">
          <button id="btn-rot-left" class="flex-1">↺ Left</button>
          <button id="btn-rot-right" class="flex-1">↻ Right</button>
        </div>
      </div>
      <div class="view-snap">
        <button class="snap-btn" data-view="top">⬇ Top</button>
        <button class="snap-btn" data-view="front">➡ Front</button>
        <button class="snap-btn" data-view="right">↘ Right</button>
        <button class="snap-btn" data-view="back">⬆ Back</button>
      </div>
      <button id="btn-reset" class="full mt-1">Reset View</button>
    </div>

    <div class="panel">
      <h2>Color Mode</h2>
      <div class="mode-btns">
        <button data-mode="rgb" class="active">RGB</button>
        <button data-mode="height">Height</button>
        <button data-mode="intensity">Intensity</button>
        <button data-mode="depth">Depth</button>
        <button data-mode="classification">Class</button>
      </div>
    </div>

    <div class="panel">
      <h2>Point Size</h2>
      <div class="row"><label>Type</label><select id="point-size-type"><option value="1">Auto (zoom)</option><option value="0">Fixed</option></select></div>
      <div class="row mt-1"><label>Size</label><input type="range" id="point-size" min="1" max="50" step="0.5" value="3" /><span class="val" id="point-size-val">3.0</span></div>
      <div class="row mt-1"><label>Sketch Effect</label><input type="range" id="sketch-opacity" min="0" max="1" step="0.05" value="0" /><span class="val" id="sketch-opacity-val">Off</span></div>
      <div class="row mt-1"><label>Dreamy</label><input type="range" id="dreamy" min="0" max="1" step="0.05" value="0" /><span class="val" id="dreamy-val">Off</span></div>
    </div>

    <div class="panel">
      <h2>Lighting</h2>
      <div class="row"><label>Light Azimuth</label><input type="range" id="light-az" min="0" max="360" step="1" value="315" /><span class="val" id="light-az-val">315°</span></div>
      <div class="row"><label>Light Elevation</label><input type="range" id="light-el" min="5" max="85" step="1" value="45" /><span class="val" id="light-el-val">45°</span></div>
      <div class="row"><label>Ambient</label><input type="range" id="light-amb" min="0" max="100" step="1" value="25" /><span class="val" id="light-amb-val">0.25</span></div>
      <label><input type="checkbox" id="chk-shading" checked /> Depth-based shading</label>
    </div>

    <div class="panel">
      <h2>Background</h2>
      <label><input type="checkbox" id="chk-sky" checked /> Sky gradient</label>
      <div class="row mt-1"><label>Top Color</label><input type="color" id="sky-color-top" value="#6699e6" /></div>
      <div class="row"><label>Bottom Color</label><input type="color" id="sky-color-bottom" value="#b3d9ff" /></div>
    </div>

    <div class="panel">
      <h2>Measure</h2>
      <button id="btn-measure" class="full">Measure Distance</button>
      <button id="btn-clear-measure" class="full mt-1">Clear Measurement</button>
    </div>

    <div class="panel">
      <h2>VR Mode</h2>
      <button id="btn-stream" class="primary full">Start Streaming</button>
      <p class="stat mt-2" id="stream-info">Stream to Meta Quest</p>
    </div>

  </aside>

  <main id="main">
    <button id="toggle-sidebar">☰</button>
    <canvas id="glcanvas"></canvas>
    <div id="drop-overlay"><p><strong>Drop to open</strong>PLY, LAS, LAZ, XYZ, E57</p></div>
    <div id="hud"></div>
    <div id="minimap"><canvas id="minimap-canvas" width="140" height="140"></canvas></div>
    <div id="measure-info"></div>
    <div id="loading"><div class="spinner"></div><span id="loading-text">Loading point cloud…</span></div>
  </main>
</div>

<script type="module" src="script_js/main/main.js"></script>
</body>
</html>
