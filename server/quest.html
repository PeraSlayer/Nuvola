<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nuvola VR - Meta Quest</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }
    
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 1000;
    }
    
    #overlay.hidden {
      display: none;
    }
    
    .status {
      font-size: 24px;
      margin: 20px;
      text-align: center;
    }
    
    .info {
      font-size: 16px;
      color: #888;
      margin: 10px;
      text-align: center;
      max-width: 80%;
    }
    
    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      font-weight: bold;
    }
    
    button:active {
      background: #0099cc;
    }
    
    #fps {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      z-index: 999;
    }
    
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      z-index: 999;
    }
    
    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      margin: 5px;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .control-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="fps">FPS: --</div>
  
  <div id="controls">
    <button class="control-btn" onclick="moveForward()">↑ Avanti</button>
    <button class="control-btn" onclick="moveBackward()">↓ Indietro</button>
    <button class="control-btn" onclick="resetCamera()">⟲ Reset</button>
  </div>
  
  <div id="overlay">
    <div class="status">🌩️ Nuvola VR</div>
    <div class="info">Connessione al server...</div>
    <button onclick="startVR()">Avvia VR</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const overlay = document.getElementById('overlay');
    const fpsDisplay = document.getElementById('fps');
    
    let ws = null;
    let isConnected = false;
    let frameCount = 0;
    let lastFpsTime = Date.now();
    
    // Segnali accumulati (delta)
    let signals = { yaw: 0, pitch: 0, zoom: 0, panX: 0, panY: 0 };
    
    // Ultimo orientamento noto per calcolare delta
    let lastOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let orientationInitialized = false;
    
    // Device orientation
    let useDeviceOrientation = false;
    
    // Canvas offscreen per decoding
    const offscreenCanvas = document.createElement('canvas');
    const offscreenCtx = offscreenCanvas.getContext('2d', { alpha: false });
    
    // Resize canvas con risoluzione molto ridotta per performance
    function resizeCanvas() {
      // Usa risoluzione molto ridotta (50%) per massimizzare performance
      const scale = 0.5;
      canvas.width = window.innerWidth * scale;
      canvas.height = window.innerHeight * scale;
      
      // Canvas offscreen stessa dimensione
      offscreenCanvas.width = canvas.width;
      offscreenCanvas.height = canvas.height;
      
      // Mantieni dimensione visuale con CSS
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      
      // Disabilita antialiasing per performance
      ctx.imageSmoothingEnabled = false;
      offscreenCtx.imageSmoothingEnabled = false;
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // Connessione WebSocket
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      
      console.log('Connessione a:', wsUrl);
      overlay.querySelector('.info').textContent = 'Connessione al server...';
      
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';
      
      ws.onopen = () => {
        console.log('✓ Connesso al server');
        isConnected = true;
        overlay.classList.add('hidden');
        startOrientationTracking();
      };
      
      ws.onmessage = (event) => {
        // Ricevi frame JPEG
        const blob = new Blob([event.data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        
        img.onload = () => {
          // Decodifica su canvas offscreen
          offscreenCtx.drawImage(img, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
          URL.revokeObjectURL(url);
          
          // Copia sul canvas principale (operazione veloce)
          requestAnimationFrame(() => {
            ctx.drawImage(offscreenCanvas, 0, 0);
          });
          
          // Aggiorna FPS
          frameCount++;
          const now = Date.now();
          if (now - lastFpsTime >= 1000) {
            fpsDisplay.textContent = `FPS: ${frameCount}`;
            frameCount = 0;
            lastFpsTime = now;
          }
        };
        
        img.src = url;
      };
      
      ws.onclose = () => {
        console.log('Connessione chiusa');
        isConnected = false;
        overlay.classList.remove('hidden');
        overlay.querySelector('.info').textContent = 'Connessione persa. Ricarica la pagina.';
      };
      
      ws.onerror = (error) => {
        console.error('Errore WebSocket:', error);
        overlay.querySelector('.info').textContent = 'Errore di connessione. Controlla il server.';
      };
    }
    
    // Tracking orientamento dispositivo
    function startOrientationTracking() {
      if (window.DeviceOrientationEvent) {
        // Richiedi permessi per iOS 13+
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permission => {
              if (permission === 'granted') {
                enableOrientationTracking();
              }
            })
            .catch(console.error);
        } else {
          enableOrientationTracking();
        }
      }
    }
    
    function enableOrientationTracking() {
      useDeviceOrientation = true;
      
      window.addEventListener('deviceorientation', (event) => {
        const alpha = event.alpha || 0;
        const beta = event.beta || 0;
        const gamma = event.gamma || 0;
        
        if (!orientationInitialized) {
          lastOrientation = { alpha, beta, gamma };
          orientationInitialized = true;
          return;
        }
        
        // Calcola delta dal precedente orientamento
        let deltaAlpha = alpha - lastOrientation.alpha;
        let deltaBeta = beta - lastOrientation.beta;
        let deltaGamma = gamma - lastOrientation.gamma;
        
        // Gestisci wrap-around per alpha (0-360)
        if (deltaAlpha > 180) deltaAlpha -= 360;
        if (deltaAlpha < -180) deltaAlpha += 360;
        
        // Accumula segnali (converti in radianti e scala per sensibilità)
        signals.yaw += deltaGamma * Math.PI / 180;
        signals.pitch += (deltaBeta) * Math.PI / 180;
        
        lastOrientation = { alpha, beta, gamma };
      });
    }
    
    // Controlli touch per movimento
    let touchStart = null;
    let lastTouchDistance = 0;
    
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1) {
        // Single touch - start rotation
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        // Pinch start - start zoom
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1 && touchStart) {
        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touch.clientY - touchStart.y;
        
        // Accumula segnali di rotazione dal drag
        signals.yaw += deltaX * 0.005;
        signals.pitch += deltaY * 0.005;
        
        touchStart = { x: touch.clientX, y: touch.clientY };
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (lastTouchDistance > 0) {
          const delta = lastTouchDistance - distance;
          signals.zoom += delta * 0.001;
        }
        
        lastTouchDistance = distance;
      }
    });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 0) {
        touchStart = null;
        lastTouchDistance = 0;
      }
    });
    
    // Controlli click/tap - coordinate normalizzate (0-1)
    canvas.addEventListener('click', (e) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        ws.send(JSON.stringify({ type: 'click', x, y }));
      }
    });
    
    // Controlli movimento
    function moveForward() {
      signals.zoom -= 0.5;
    }
    
    function moveBackward() {
      signals.zoom += 0.5;
    }
    
    function resetCamera() {
      signals = { yaw: 0, pitch: 0, zoom: 0, panX: 0, panY: 0 };
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'reset' }));
      }
    }
    
    // Invia segnali accumulati e resetta
    function sendSignals() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (signals.yaw === 0 && signals.pitch === 0 && signals.zoom === 0 && signals.panX === 0 && signals.panY === 0) return;
      
      ws.send(JSON.stringify({
        type: 'signal',
        yaw: signals.yaw,
        pitch: signals.pitch,
        zoom: signals.zoom,
        panX: signals.panX,
        panY: signals.panY
      }));
      
      signals = { yaw: 0, pitch: 0, zoom: 0, panX: 0, panY: 0 };
    }
    
    // Avvia VR
    function startVR() {
      if (!isConnected) {
        connect();
      }
    }
    
    // Avvia connessione automatica
    connect();
    
    // Invia segnali periodicamente
    setInterval(() => {
      if (isConnected) {
        sendSignals();
      }
    }, 100); // 10 Hz
  </script>
</body>
</html>
