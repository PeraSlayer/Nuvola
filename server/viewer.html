<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvola Viewer - Stream Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    #viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 9999;
      max-width: 400px;
    }
    
    #status.error {
      color: #f00;
    }
    
    #status.warning {
      color: #ff0;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      z-index: 9999;
      display: flex;
      gap: 10px;
    }
    
    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    button:hover {
      background: #00b8e6;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="status">Inizializzazione...</div>
  
  <div id="viewer-container">
    <iframe id="viewer-frame" src="index.html"></iframe>
  </div>
  
  <div id="controls">
    <button id="btn-start" onclick="startStreaming()">Avvia Streaming</button>
    <button id="btn-stop" onclick="stopStreaming()" disabled>Ferma Streaming</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const viewerFrame = document.getElementById('viewer-frame');
    
    let ws = null;
    let isStreaming = false;
    let frameInterval = null;
    let frameCount = 0;
    let lastFpsTime = Date.now();
    
    function updateStatus(message, type = 'info') {
      statusEl.textContent = message;
      statusEl.className = type;
    }
    
    // Connetti al WebSocket server
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      
      updateStatus('Connessione al server...');
      
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';
      
      ws.onopen = () => {
        updateStatus('✓ Connesso al server. Premi "Avvia Streaming" per iniziare.', 'info');
        btnStart.disabled = false;
      };
      
      ws.onmessage = (event) => {
        // Ricevi comandi dal Quest (tracking data)
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'tracking') {
            // Invia il tracking al viewer
            viewerFrame.contentWindow.postMessage({
              type: 'camera-update',
              position: data.position,
              rotation: data.rotation
            }, '*');
          }
        } catch (error) {
          console.error('Errore parsing messaggio:', error);
        }
      };
      
      ws.onclose = () => {
        updateStatus('Connessione persa. Ricarica la pagina.', 'error');
        btnStart.disabled = true;
        btnStop.disabled = true;
      };
      
      ws.onerror = (error) => {
        updateStatus('Errore di connessione. Controlla il server.', 'error');
      };
    }
    
    // Cattura un frame dal canvas del viewer
    function captureFrame() {
      try {
        const viewerWindow = viewerFrame.contentWindow;
        const canvas = viewerWindow.document.getElementById('glcanvas');
        
        if (!canvas) {
          updateStatus('Canvas non trovato nel viewer', 'error');
          return null;
        }
        
        // Cattura il frame come JPEG
        return canvas.toDataURL('image/jpeg', 0.7);
      } catch (error) {
        console.error('Errore cattura frame:', error);
        return null;
      }
    }
    
    // Invia un frame al Quest
    function sendFrame() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      
      const dataUrl = captureFrame();
      if (!dataUrl) return;
      
      // Converti data URL in blob
      const byteString = atob(dataUrl.split(',')[1]);
      const mimeString = dataUrl.split(',')[0].split(':')[1].split(';')[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      
      const blob = new Blob([ab], { type: mimeString });
      
      // Invia come binary
      ws.send(blob);
      
      // Aggiorna FPS
      frameCount++;
      const now = Date.now();
      if (now - lastFpsTime >= 1000) {
        updateStatus(`Streaming attivo - FPS: ${frameCount} - Client connessi`, 'info');
        frameCount = 0;
        lastFpsTime = now;
      }
    }
    
    // Avvia streaming
    function startStreaming() {
      if (isStreaming) return;
      
      isStreaming = true;
      btnStart.disabled = true;
      btnStop.disabled = false;
      
      updateStatus('Avvio streaming...', 'info');
      
      // Invia frame a 30 FPS
      frameInterval = setInterval(sendFrame, 33); // ~30 FPS
      
      updateStatus('Streaming attivo', 'info');
    }
    
    // Ferma streaming
    function stopStreaming() {
      if (!isStreaming) return;
      
      isStreaming = false;
      btnStart.disabled = false;
      btnStop.disabled = true;
      
      if (frameInterval) {
        clearInterval(frameInterval);
        frameInterval = null;
      }
      
      updateStatus('Streaming fermato', 'warning');
    }
    
    // Inizializzazione
    window.addEventListener('load', () => {
      // Attendi che il viewer sia caricato
      setTimeout(() => {
        connectWebSocket();
      }, 2000);
    });
    
    // Gestione errori del viewer
    viewerFrame.addEventListener('error', () => {
      updateStatus('Errore nel caricamento del viewer', 'error');
    });
  </script>
</body>
</html>
